# Render.com deployment configuration
services:
  - type: web
    name: einstein-ai-api
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    envVars:
      - key: HUGGINGFACE_API_KEY
        sync: false
      - key: HUGGINGFACE_MODEL
        value: microsoft/DialoGPT-medium
    plan: free

